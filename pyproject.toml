[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent1"
version = "0.1.0"
requires-python = ">=3.12"
description = "Retail agent with tool execution, grounded responses, and persistent conversations"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "joblib>=1.3,<2",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
chat = ["gradio==6.31.0"]
inference = [
    "torch>=2.6,<3",
    "transformers>=4.56,<6",
    "peft>=0.17,<1",
    "accelerate>=1,<2",
    "bitsandbytes>=0.45,<1",
    "sentence-transformers>=3,<6",
]
mongo = ["pymongo>=4.6,<5"]

[project.scripts]
agent1-chat = "agent1.chat:main"


[tool.setuptools.packages.find]
where = ["src"]
