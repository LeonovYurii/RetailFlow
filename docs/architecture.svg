<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030" role="img" aria-labelledby="title desc">
<title id="title">RetailFlow request and persistence flow</title>
<desc id="desc">A new message enters the chat session, intent routing and LLM planning. The validated plan leads to a control-flow reply, tool execution, or knowledge retrieval. Tools and knowledge support response generation. The reply and state are checkpointed to SQLite or MongoDB before the normal saved reply is displayed. Pending replies may resume an existing plan.</desc>
